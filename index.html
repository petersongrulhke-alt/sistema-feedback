<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Avaliação do Projeto</title>

  

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="apple-mobile-web-app-title" content="Avaliação">

  

  <script src="https://cdn.tailwindcss.com"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/lucide@latest"></script>

  

  <style>

    body {

      font-family: 'Inter', sans-serif;

      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);

      -webkit-touch-callout: none;

      -webkit-user-select: none;

      user-select: none;

    }



    .sticker-btn {

      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;

      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);

      -webkit-tap-highlight-color: transparent;

    }

    

    .sticker-btn:active {

      transform: translateY(-2px) scale(0.95);

    }



    .sticker-border {

      box-shadow: inset 0 0 0 6px #ffffff, 0 4px 15px rgba(0,0,0,0.08);

    }



    .animate-pop {

      animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;

    }



    @keyframes popIn {

      0% { opacity: 0; transform: scale(0.8); }

      100% { opacity: 1; transform: scale(1); }

    }

  </style>

</head>

<body class="min-h-screen flex flex-col justify-between items-center p-4 text-slate-800 antialiased overflow-hidden">



  <header class="w-full max-w-4xl flex justify-between items-center p-2 sm:p-4">

    <div class="flex items-center gap-2">

      <span class="inline-block w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>

      <span class="text-xs font-semibold text-slate-500 tracking-wider uppercase">Sistema de Feedback Ativo</span>

    </div>

    

    <div class="flex gap-2">

      <button onclick="toggleFullScreen()" class="flex items-center gap-2 px-3 py-1.5 text-xs font-medium text-slate-500 bg-white/80 hover:bg-white rounded-full shadow-sm border border-slate-200 transition-all hover:text-slate-800">

        <i data-lucide="maximize" class="w-3.5 h-3.5"></i>

        <span class="hidden sm:inline">Tela Cheia</span>

      </button>

      <button onclick="openAdminAuth()" class="flex items-center gap-2 px-3 py-1.5 text-xs font-medium text-slate-500 bg-white/80 hover:bg-white rounded-full shadow-sm border border-slate-200 transition-all hover:text-slate-800">

        <i data-lucide="lock" class="w-3.5 h-3.5"></i>

        <span class="hidden sm:inline">Painel Admin</span>

      </button>

    </div>

  </header>



  <main class="w-full max-w-3xl flex flex-col items-center justify-center my-auto py-8 text-center">

    <div class="mb-10 sm:mb-14 space-y-3 px-4">

      <h1 class="text-2xl sm:text-4xl md:text-5xl font-extrabold text-slate-800 tracking-tight leading-tight">

        Sua opinião é muito importante para nós

      </h1>

      <p class="text-base sm:text-lg text-slate-600 font-medium">

        Deixe aqui sua avaliação

      </p>

    </div>



    <div class="flex flex-row justify-center gap-6 sm:gap-10 md:gap-14 w-full px-4 max-w-2xl">

      <div class="flex flex-col items-center">

        <button onclick="submitVote('ruim')" class="sticker-btn w-28 h-28 sm:w-36 sm:h-36 rounded-full bg-white p-2 sm:p-3 flex items-center justify-center">

          <div class="w-full h-full rounded-full bg-[#E52421] flex items-center justify-center sticker-border">

            <svg class="w-16 h-16 sm:w-20 sm:h-20 text-slate-900" viewBox="0 0 100 100" fill="none">

              <circle cx="34" cy="38" r="5.5" fill="#291206"/>

              <circle cx="66" cy="38" r="5.5" fill="#291206"/>

              <path d="M 28 68 Q 50 48 72 68" stroke="#291206" stroke-width="6.5" stroke-linecap="round" fill="none"/>

            </svg>

          </div>

        </button>

        <span class="mt-4 text-xl sm:text-2xl font-extrabold text-[#E52421] tracking-wide">Ruim</span>

      </div>



      <div class="flex flex-col items-center">

        <button onclick="submitVote('bom')" class="sticker-btn w-28 h-28 sm:w-36 sm:h-36 rounded-full bg-white p-2 sm:p-3 flex items-center justify-center">

          <div class="w-full h-full rounded-full bg-[#FFD600] flex items-center justify-center sticker-border">

            <svg class="w-16 h-16 sm:w-20 sm:h-20 text-slate-900" viewBox="0 0 100 100" fill="none">

              <circle cx="34" cy="38" r="5.5" fill="#422006"/>

              <circle cx="66" cy="38" r="5.5" fill="#422006"/>

              <path d="M 30 60 L 70 58" stroke="#422006" stroke-width="6.5" stroke-linecap="round" fill="none"/>

            </svg>

          </div>

        </button>

        <span class="mt-4 text-xl sm:text-2xl font-extrabold text-[#E5A700] tracking-wide">Bom</span>

      </div>



      <div class="flex flex-col items-center">

        <button onclick="submitVote('otimo')" class="sticker-btn w-28 h-28 sm:w-36 sm:h-36 rounded-full bg-white p-2 sm:p-3 flex items-center justify-center">

          <div class="w-full h-full rounded-full bg-[#8BC34A] flex items-center justify-center sticker-border">

            <svg class="w-16 h-16 sm:w-20 sm:h-20 text-slate-900" viewBox="0 0 100 100" fill="none">

              <circle cx="34" cy="38" r="5.5" fill="#0E2A00"/>

              <circle cx="66" cy="38" r="5.5" fill="#0E2A00"/>

              <path d="M 28 52 Q 50 78 72 52" stroke="#0E2A00" stroke-width="6.5" stroke-linecap="round" fill="none"/>

            </svg>

          </div>

        </button>

        <span class="mt-4 text-xl sm:text-2xl font-extrabold text-[#7CB342] tracking-wide">Ótimo</span>

      </div>

    </div>

  </main>



  <div id="toastMsg" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-lg font-medium text-sm transition-all duration-300 opacity-0 pointer-events-none z-50">

    Mensagem

  </div>



  <div id="thankYouOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">

    <div class="bg-white rounded-3xl p-8 sm:p-12 text-center max-w-md w-full shadow-2xl animate-pop flex flex-col items-center">

      <div class="w-20 h-20 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mb-6">

        <i data-lucide="check-circle-2" class="w-12 h-12"></i>

      </div>

      <h3 class="text-2xl sm:text-3xl font-extrabold text-slate-800 mb-2">Muito Obrigado!</h3>

      <p class="text-slate-600 text-base sm:text-lg">Seu feedback foi registrado.</p>

    </div>

  </div>



  <div id="authModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">

    <div class="bg-white rounded-2xl p-6 sm:p-8 max-w-sm w-full shadow-2xl animate-pop">

      <div class="flex justify-between items-center mb-4">

        <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">

          <i data-lucide="shield-lock" class="w-5 h-5 text-indigo-600"></i> Acesso Restrito

        </h3>

        <button onclick="closeModal('authModal')" class="text-slate-400 p-2">

          <i data-lucide="x" class="w-5 h-5"></i>

        </button>

      </div>

      <form onsubmit="verifyPassword(event)" class="space-y-4">

        <input type="password" id="passcodeInput" placeholder="Senha (1234)" inputmode="numeric" class="w-full px-4 py-3 rounded-xl border border-slate-300 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">

        <p id="authErrorMsg" class="text-xs text-rose-500 font-medium hidden">Senha incorreta.</p>

        <button type="submit" class="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl">Entrar</button>

      </form>

    </div>

  </div>



  <div id="adminModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">

    <div class="bg-white rounded-3xl p-6 max-w-lg w-full shadow-2xl animate-pop">

      <div class="flex justify-between items-start pb-4 border-b border-slate-100 mb-6">

        <h2 class="text-2xl font-bold text-slate-800">Resultados</h2>

        <button onclick="closeModal('adminModal')" class="text-slate-400 p-1">

          <i data-lucide="x" class="w-6 h-6"></i>

        </button>

      </div>



      <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 mb-6 text-center">

        <span class="text-xs font-bold uppercase text-slate-400">Total de Votos</span>

        <div id="totalVotesCount" class="text-4xl font-black text-slate-800 mt-1">0</div>

      </div>



      <div class="space-y-4 mb-8">

        <div class="space-y-1">

          <div class="flex justify-between text-sm font-semibold"><span class="text-[#E52421]">Ruim</span><span id="ruimStatText">0 (0%)</span></div>

          <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden"><div id="ruimBar" class="h-full bg-[#E52421] transition-all" style="width: 0%"></div></div>

        </div>

        <div class="space-y-1">

          <div class="flex justify-between text-sm font-semibold"><span class="text-[#E5A700]">Bom</span><span id="bomStatText">0 (0%)</span></div>

          <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden"><div id="bomBar" class="h-full bg-[#FFD600] transition-all" style="width: 0%"></div></div>

        </div>

        <div class="space-y-1">

          <div class="flex justify-between text-sm font-semibold"><span class="text-[#7CB342]">Ótimo</span><span id="otimoStatText">0 (0%)</span></div>

          <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden"><div id="otimoBar" class="h-full bg-[#8BC34A] transition-all" style="width: 0%"></div></div>

        </div>

      </div>



      <div class="flex gap-3 pt-4 border-t border-slate-100">

        <button onclick="executeReset()" class="flex-1 py-2 bg-rose-50 text-rose-600 font-medium text-sm rounded-xl">Zerar Tudo</button>

      </div>

    </div>

  </div>



  <script>

    lucide.createIcons();

    const STORAGE_KEY = 'feedback_votos_salvos';

    

    function getVotes() {

      const stored = localStorage.getItem(STORAGE_KEY);

      return stored ? JSON.parse(stored) : { ruim: 0, bom: 0, otimo: 0 };

    }



    function saveVotes(votes) {

      localStorage.setItem(STORAGE_KEY, JSON.stringify(votes));

    }



    function submitVote(type) {

      const votes = getVotes();

      votes[type]++;

      saveVotes(votes);

      

      const overlay = document.getElementById('thankYouOverlay');

      overlay.classList.remove('hidden');

      setTimeout(() => overlay.classList.add('hidden'), 1500);

    }



    function toggleFullScreen() {

      try {

        if (!document.fullscreenElement) {

          document.documentElement.requestFullscreen().catch(() => {

            showToast("A tela cheia será ativada quando estiver no GitHub");

          });

        } else {

          document.exitFullscreen();

        }

      } catch (e) {

        showToast("Abra pelo ícone na Tela de Início para tela cheia");

      }

    }



    function showToast(msg) {

      const toast = document.getElementById('toastMsg');

      toast.textContent = msg;

      toast.style.opacity = '1';

      setTimeout(() => { toast.style.opacity = '0'; }, 3000);

    }



    function openAdminAuth() {

      document.getElementById('passcodeInput').value = '';

      document.getElementById('authErrorMsg').classList.add('hidden');

      document.getElementById('authModal').classList.remove('hidden');

    }



    function verifyPassword(event) {

      event.preventDefault();

      if (document.getElementById('passcodeInput').value === '1234') {

        closeModal('authModal');

        openAdminDashboard();

      } else {

        document.getElementById('authErrorMsg').classList.remove('hidden');

      }

    }



    function openAdminDashboard() {

      updateDashboardData();

      document.getElementById('adminModal').classList.remove('hidden');

    }



    function updateDashboardData() {

      const votes = getVotes();

      const total = votes.ruim + votes.bom + votes.otimo;

      document.getElementById('totalVotesCount').textContent = total;



      const calcPct = (val) => total > 0 ? ((val / total) * 100).toFixed(1) : '0';

      

      document.getElementById('ruimStatText').textContent = `${votes.ruim} (${calcPct(votes.ruim)}%)`;

      document.getElementById('bomStatText').textContent = `${votes.bom} (${calcPct(votes.bom)}%)`;

      document.getElementById('otimoStatText').textContent = `${votes.otimo} (${calcPct(votes.otimo)}%)`;



      document.getElementById('ruimBar').style.width = `${calcPct(votes.ruim)}%`;

      document.getElementById('bomBar').style.width = `${calcPct(votes.bom)}%`;

      document.getElementById('otimoBar').style.width = `${calcPct(votes.otimo)}%`;

    }



    function executeReset() {

      if(confirm("Tem certeza que deseja apagar todos os votos?")) {

        saveVotes({ ruim: 0, bom: 0, otimo: 0 });

        updateDashboardData();

      }

    }



    function closeModal(modalId) {

      document.getElementById(modalId).classList.add('hidden');

    }

  </script>

</body>

</html>
